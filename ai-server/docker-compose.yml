# Tablescope AI Server — Docker Compose
# Runs: FastAPI AI API, Ollama (LLM), Qdrant (Vector DB), AI Worker

services:
  tablescope-ai-api:
    build:
      context: ./tablescope-ai-api
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - OLLAMA_URL=http://ollama:11434
      - QDRANT_URL=http://qdrant:6333
    volumes:
      - /mnt/tablescope-ai/logs:/var/log/tablescope-ai
      - /mnt/tablescope-ai/runtime:/var/run/tablescope-ai
    depends_on:
      ollama:
        condition: service_started
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    runtime: nvidia
    volumes:
      - /mnt/tablescope-ai/ollama:/root/.ollama
    environment:
      # Serve several requests at once and keep the model resident so
      # concurrent project analyses don't queue behind a single slot or pay
      # repeated model-load latency.
      - OLLAMA_NUM_PARALLEL=4
      - OLLAMA_MAX_LOADED_MODELS=2
      - OLLAMA_KEEP_ALIVE=30m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    # NOT exposed outside Docker network — only accessible via AI API

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - /mnt/tablescope-ai/qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    # NOT exposed outside Docker network — only accessible via AI API

  ai-worker:
    build:
      context: ./tablescope-ai-api
    command: python -m app.worker
    env_file: .env
    environment:
      - OLLAMA_URL=http://ollama:11434
      - QDRANT_URL=http://qdrant:6333
    volumes:
      - /mnt/tablescope-ai/logs:/var/log/tablescope-ai
    depends_on:
      ollama:
        condition: service_started
      qdrant:
        condition: service_healthy
    restart: unless-stopped
