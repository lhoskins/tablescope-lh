# Tablescope AI Server — Docker Compose
# Runs: FastAPI AI API, Ollama (LLM), Qdrant (Vector DB), AI Worker, vLLM

services:
  tablescope-ai-api:
    build:
      context: ./tablescope-ai-api
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - OLLAMA_URL=http://ollama:11434
      - QDRANT_URL=http://qdrant:6333
    volumes:
      - /mnt/tablescope-ai/logs:/var/log/tablescope-ai
      - /mnt/tablescope-ai/runtime:/var/run/tablescope-ai
    depends_on:
      ollama:
        condition: service_started
      qdrant:
        condition: service_healthy
      vllm:
        condition: service_started
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    runtime: nvidia
    # Allow Ollama to share the GPU with vLLM. The smaller models are loaded
    # on the GPU so SQL generation and embeddings are fast.
    environment:
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_MAX_LOADED_MODELS=3
      - OLLAMA_KEEP_ALIVE=30m
      - OLLAMA_CONTEXT_LENGTH=8192
    volumes:
      - /mnt/tablescope-ai/ollama:/root/.ollama
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - /mnt/tablescope-ai/qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c \"echo > /dev/tcp/localhost/6333\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  ai-worker:
    build:
      context: ./tablescope-ai-api
    command: python -m app.worker
    env_file: .env
    environment:
      - OLLAMA_URL=http://ollama:11434
      - QDRANT_URL=http://qdrant:6333
    volumes:
      - /mnt/tablescope-ai/logs:/var/log/tablescope-ai
    depends_on:
      ollama:
        condition: service_started
      qdrant:
        condition: service_healthy
      vllm:
        condition: service_started
    restart: unless-stopped

  vllm:
    image: vllm/vllm-openai:muse-glimmer
    runtime: nvidia
    ipc: host
    ports:
      - "8001:8001"
    volumes:
      - /mnt/tablescope-ai/vllm/models/muse-glimmer-w4a16:/models
    environment:
      - TRANSFORMERS_OFFLINE=1
    command:
      - /models
      - --served-model-name
      - muse-glimmer
      - --generation-config
      - auto
      - --tensor-parallel-size
      - "1"
      - --enable-auto-tool-choice
      - --tool-call-parser
      - muse_glimmer
      - --reasoning-parser
      - muse_glimmer
      - --default-chat-template-kwargs
      - '{"reasoning_strength":"low"}'
      - --no-enable-flashinfer-autotune
      - --enable-prefix-caching
      - --port
      - "8001"
      - --max-model-len
      - "12288"
      - --gpu-memory-utilization
      - "0.9"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    # NOT exposed outside the host — only the AI API reaches it.
