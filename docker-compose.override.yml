# Inject new required env vars (TS-ISO-018) without editing the tracked compose file.
services:
  platform-api:
    environment:
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}
      METRICS_ACCESS_TOKEN: ${METRICS_ACCESS_TOKEN:-}
      GOOGLE_DRIVE_CLIENT_ID: ${GOOGLE_DRIVE_CLIENT_ID:-}
      GOOGLE_DRIVE_CLIENT_SECRET: ${GOOGLE_DRIVE_CLIENT_SECRET:-}
      GOOGLE_DRIVE_REDIRECT_URI: ${GOOGLE_DRIVE_REDIRECT_URI:-}
      GOOGLE_DRIVE_CONNECTOR_V1_ENABLED: ${GOOGLE_DRIVE_CONNECTOR_V1_ENABLED:-false}
  platform-api-worker:
    environment:
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}
      METRICS_ACCESS_TOKEN: ${METRICS_ACCESS_TOKEN:-}
      GOOGLE_DRIVE_CLIENT_ID: ${GOOGLE_DRIVE_CLIENT_ID:-}
      GOOGLE_DRIVE_CLIENT_SECRET: ${GOOGLE_DRIVE_CLIENT_SECRET:-}
      GOOGLE_DRIVE_REDIRECT_URI: ${GOOGLE_DRIVE_REDIRECT_URI:-}
      GOOGLE_DRIVE_CONNECTOR_V1_ENABLED: ${GOOGLE_DRIVE_CONNECTOR_V1_ENABLED:-false}
