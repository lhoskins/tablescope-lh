# Single-server deployment compose file for Tablescope.
#
# Runs: platform-api (FastAPI), web-ui (Next.js), Postgres metadata,
# Redis, PgBouncer (in front of Teiid), WildFly/Teiid (data engine).

services:
  teiid:
    build:
      context: ./wildfly
    image: tablescope-teiid:latest
    restart: unless-stopped
    ports:
      - "8095:8080"
      - "35442:35432"
      - "9990:9990"
    volumes:
      - teiid_data:/opt/wildfly/teiidfiles/customers
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9990/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  platform-api:
    build:
      context: ./platform-api
    image: tablescope-platform-api:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://tablescope:${POSTGRES_PASSWORD:-tablescope}@db:5432/tablescope
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      JWT_ISSUER: ${JWT_ISSUER:-tablescope-platform-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-tablescope-clients}
      SERVICE_API_KEYS: ${SERVICE_API_KEYS:-}
      TEIID_PG_HOST: teiid
      TEIID_PG_PORT: "35432"
      TEIID_SERVLET_URL: http://teiid:8080
      TEIID_SERVLET_API_KEY: ${TEIID_API_KEY:-}
      CUSTOMER_BASE_PATH: /opt/wildfly/teiidfiles/customers
      DRILLDOWN_CONFIG_PATH: /opt/redash-8.0.0-7/apps/tsTest/src/drilldownConfig.json
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-tablescope-data-988823366090}
      S3_REGION: ${S3_REGION:-us-west-1}
      S3_ENABLED: ${S3_ENABLED:-true}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-west-1}
      CLERK_JWKS_URL: ${CLERK_JWKS_URL:-}
      CLERK_ISSUER: ${CLERK_ISSUER:-}
      SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL:-}
      SUPABASE_ISSUER: ${SUPABASE_ISSUER:-}
      SUPABASE_ENV: ${SUPABASE_ENV:-test}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_DATABASE_URL: ${SUPABASE_DATABASE_URL:-}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      STRIPE_MODE: ${STRIPE_MODE:-test}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL:-https://app.tablescope.cloud/billing/success?session_id={CHECKOUT_SESSION_ID}}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL:-https://app.tablescope.cloud/billing/cancel}
      APP_BASE_URL: ${APP_BASE_URL:-https://app.tablescope.cloud}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-support@tablescope.cloud}
      EMAIL_FROM: ${EMAIL_FROM:-Tablescope <no-reply@tablescope.cloud>}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      PROMETHEUS_ENABLED: "true"
      TABLESCOPE_AI_ENABLED: ${TABLESCOPE_AI_ENABLED:-false}
      TABLESCOPE_AI_API_URL: ${TABLESCOPE_AI_API_URL:-}
      TABLESCOPE_AI_SIGNING_SECRET: ${TABLESCOPE_AI_SIGNING_SECRET:-}
    volumes:
      - teiid_data:/opt/wildfly/teiidfiles/customers
      # Read-write access to per-tenant root so the platform API can manage
      # tenant files (upload, delete) and verify VDB directories.
      - /opt/tablescope:/opt/tablescope
      # Read-only view of the firewall applied-markers for health reporting.
      - /etc/tablescope:/etc/tablescope:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      teiid:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - default
      - tenant_acme_net

  platform-api-worker:
    build:
      context: ./platform-api
    image: tablescope-platform-api:latest
    restart: unless-stopped
    command: arq app.tasks.workflows.WorkerSettings
    environment:
      DATABASE_URL: postgresql+asyncpg://tablescope:${POSTGRES_PASSWORD:-tablescope}@db:5432/tablescope
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      TEIID_SERVLET_URL: http://teiid:8080
      TEIID_SERVLET_API_KEY: ${TEIID_API_KEY:-}
      CUSTOMER_BASE_PATH: /opt/wildfly/teiidfiles/customers
    volumes:
      - teiid_data:/opt/wildfly/teiidfiles/customers
      - /opt/tablescope:/opt/tablescope
      - /etc/tablescope:/etc/tablescope:ro
    depends_on:
      - redis
      - platform-api

  platform-api-migrate:
    build:
      context: ./platform-api
    image: tablescope-platform-api:latest
    restart: "no"
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+psycopg2://tablescope:${POSTGRES_PASSWORD:-tablescope}@db:5432/tablescope
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - web-ui
      - platform-api
    # Reload periodically so renewed certificates are picked up without a restart.
    command: >-
      /bin/sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # Attempt renewal twice a day; certbot only renews when near expiry.
    entrypoint: >-
      /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done"

  web-ui:
    build:
      context: ./web-ui
    image: tablescope-web-ui:latest
    restart: unless-stopped
    # Not published to the host: reachable only via the nginx reverse proxy.
    expose:
      - "3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
    depends_on:
      - platform-api

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tablescope
      POSTGRES_USER: tablescope
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tablescope}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tablescope"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    environment:
      DB_HOST: teiid
      DB_PORT: "35432"
      DB_NAME: ${TEIID_PG_DEFAULT_VDB:-myvdbtest}
      DB_USER: ${TEIID_PG_USER:-test}
      DB_PASSWORD: ${TEIID_PG_PASSWORD:-test}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "200"
      DEFAULT_POOL_SIZE: "20"
      AUTH_TYPE: scram-sha-256
    ports:
      - "35443:5432"
    depends_on:
      - teiid

volumes:
  postgres_data:
  redis_data:
  teiid_data:
  certbot_conf:
  certbot_www:

networks:
  default:
  tenant_acme_net:
    external: true
