<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">AI-created Sales Operation Dashboard using the ITSM layout</title>
  <desc id="desc">Code-based product mockup showing the shared header, filters, operational brief, KPI row, balanced chart grid, scaled axes, and improvement opportunities in the bottom-right.</desc>
  <defs>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .muted { fill: #667085; }
      .tiny { font-size: 11px; }
      .small { font-size: 12px; }
      .body { font-size: 13px; }
      .label { font-size: 12px; font-weight: 650; }
      .heading { font-size: 18px; font-weight: 700; }
      .kpi { font-size: 22px; font-weight: 750; }
      .card { fill: #fff; stroke: #e5eaf1; stroke-width: 1; }
      .control { fill: #fff; stroke: #cfd6e1; stroke-width: 1; }
      .grid { stroke: #edf0f5; stroke-width: 1; }
      .axis { stroke: #b8c2d1; stroke-width: 1; }
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#101828" flood-opacity="0.07"/></filter>
  </defs>

  <rect width="1600" height="920" fill="#f8fafc"/>
  <rect x="24" y="20" width="1552" height="880" rx="12" fill="#fff" stroke="#e7ebf1"/>

  <!-- Shared ITSM header -->
  <path d="M52 64 l8 -8 M52 64 l8 8" fill="none" stroke="#667085" stroke-width="1.7" stroke-linecap="round"/>
  <text x="74" y="60" class="heading">Sales Operation Dashboard</text>
  <rect x="318" y="42" width="38" height="20" rx="10" fill="#edf5ff"/><text x="329" y="56" class="tiny" fill="#2571d8">Live</text>
  <text x="74" y="80" class="small muted">Operational patterns, contributors and recommended actions · Last 1 year</text>

  <g transform="translate(735 38)">
    <rect class="control" width="112" height="32" rx="6"/><text x="12" y="21" class="small">Period: 1 Year</text><path d="M98 13 l4 4 4 -4" fill="none" stroke="#667085"/>
    <rect class="control" x="120" width="64" height="32" rx="6"/><text x="134" y="21" class="small">Site</text><path d="M170 13 l4 4 4 -4" fill="none" stroke="#667085"/>
    <rect class="control" x="192" width="112" height="32" rx="6"/><text x="204" y="21" class="small">Site: All sites</text><path d="M290 13 l4 4 4 -4" fill="none" stroke="#667085"/>
    <rect class="control" x="312" width="178" height="32" rx="6"/><text x="324" y="21" class="small">Sales Operation Dashboard</text><path d="M476 13 l4 4 4 -4" fill="none" stroke="#667085"/>
    <rect class="control" x="498" width="84" height="32" rx="6"/><text x="510" y="21" class="small">Edit layout</text>
    <rect class="control" x="590" width="100" height="32" rx="6"/><text x="602" y="21" class="small">✦ Edit with AI</text>
    <rect class="control" x="698" width="90" height="32" rx="6"/><path d="M711 16 a6 6 0 1 1 3 6" fill="none" stroke="#667085"/><path d="M711 11 v6 h6" fill="none" stroke="#667085"/><text x="730" y="21" class="small">Refresh</text>
  </g>

  <!-- Operational brief -->
  <line x1="48" y1="100" x2="1552" y2="100" stroke="#e7ebf1"/>
  <line x1="48" y1="172" x2="1552" y2="172" stroke="#e7ebf1"/>
  <text x="56" y="126" class="label">Operational brief</text><text x="56" y="145" class="tiny muted">The story behind the selected period</text>
  <circle cx="340" cy="125" r="5" fill="#f43f5e"/><text x="356" y="124" class="label">Backing risk</text><text x="356" y="143" class="tiny muted">Backlog is concentrated in two regions and is rising faster than revenue.</text>
  <circle cx="770" cy="125" r="5" fill="#f59e0b"/><text x="786" y="124" class="label">Primary driver</text><text x="786" y="143" class="tiny muted">Enterprise demand accounts for 36% of the month-over-month increase.</text>
  <circle cx="1190" cy="125" r="5" fill="#10b981"/><text x="1206" y="124" class="label">Recommended action</text><text x="1206" y="143" class="tiny muted">Rebalance coverage toward the highest-growth sites before next forecast.</text>

  <!-- KPI row -->
  <g filter="url(#shadow)">
    <rect class="card" x="48" y="190" width="742" height="82" rx="9"/>
    <rect class="card" x="806" y="190" width="746" height="82" rx="9"/>
  </g>
  <text x="66" y="216" class="tiny muted">TOTAL REVENUE</text><text x="66" y="246" class="kpi">$207.8M</text><text x="178" y="246" class="tiny" fill="#059669">↑ 8.4% vs prior year</text>
  <text x="824" y="216" class="tiny muted">TOTAL BACKLOG</text><text x="824" y="246" class="kpi">$37.1M</text><text x="930" y="246" class="tiny" fill="#b42318">↑ 5.2% vs prior year</text>

  <!-- Main backlog chart -->
  <g filter="url(#shadow)"><rect class="card" x="48" y="288" width="742" height="420" rx="9"/></g>
  <text x="66" y="316" class="label">Monthly Backlog</text><text x="66" y="334" class="tiny muted">Backlog value by month · select a point for supporting detail</text>
  <text transform="translate(76 526) rotate(-90)" class="tiny muted">USD (thousands)</text>
  <line class="axis" x1="112" y1="650" x2="756" y2="650"/><line class="axis" x1="112" y1="358" x2="112" y2="650"/>
  <g class="tiny muted">
    <text x="76" y="654">0</text><text x="60" y="596">1,000</text><text x="60" y="538">2,000</text><text x="60" y="480">3,000</text><text x="60" y="422">4,000</text><text x="60" y="364">5,000</text>
    <text x="104" y="672">Jan</text><text x="220" y="672">Mar</text><text x="336" y="672">May</text><text x="452" y="672">Jul</text><text x="568" y="672">Sep</text><text x="684" y="672">Nov</text>
  </g>
  <g class="grid"><line x1="112" y1="592" x2="756" y2="592"/><line x1="112" y1="534" x2="756" y2="534"/><line x1="112" y1="476" x2="756" y2="476"/><line x1="112" y1="418" x2="756" y2="418"/><line x1="112" y1="360" x2="756" y2="360"/></g>
  <path d="M112 372 C170 388 180 410 228 430 S292 486 344 520 S406 582 460 604 S518 640 576 646 S642 644 696 642 S728 626 756 616 L756 650 L112 650 Z" fill="#e9f1ff"/>
  <path d="M112 372 C170 388 180 410 228 430 S292 486 344 520 S406 582 460 604 S518 640 576 646 S642 644 696 642 S728 626 756 616" fill="none" stroke="#3478f6" stroke-width="3"/>
  <g fill="#fff" stroke="#3478f6" stroke-width="2"><circle cx="112" cy="372" r="4"/><circle cx="228" cy="430" r="4"/><circle cx="344" cy="520" r="4"/><circle cx="460" cy="604" r="4"/><circle cx="576" cy="646" r="4"/><circle cx="696" cy="642" r="4"/><circle cx="756" cy="616" r="4"/></g>

  <!-- Top-right combo chart -->
  <g filter="url(#shadow)"><rect class="card" x="806" y="288" width="746" height="202" rx="9"/></g>
  <text x="824" y="316" class="label">Monthly Revenue vs Backlog</text><text x="824" y="334" class="tiny muted">USD (thousands)</text>
  <line class="axis" x1="862" y1="450" x2="1524" y2="450"/>
  <g class="grid"><line x1="862" y1="414" x2="1524" y2="414"/><line x1="862" y1="378" x2="1524" y2="378"/><line x1="862" y1="342" x2="1524" y2="342"/></g>
  <g fill="#2f6fec"><rect x="884" y="425" width="28" height="25" rx="2"/><rect x="982" y="416" width="28" height="34" rx="2"/><rect x="1080" y="420" width="28" height="30" rx="2"/><rect x="1178" y="408" width="28" height="42" rx="2"/><rect x="1276" y="414" width="28" height="36" rx="2"/><rect x="1374" y="402" width="28" height="48" rx="2"/><rect x="1472" y="410" width="28" height="40" rx="2"/></g>
  <path d="M898 350 L996 366 L1094 392 L1192 418 L1290 430 L1388 438 L1486 432" fill="none" stroke="#35a7bd" stroke-width="2.5"/>
  <g fill="#fff" stroke="#35a7bd" stroke-width="2"><circle cx="898" cy="350" r="3"/><circle cx="996" cy="366" r="3"/><circle cx="1094" cy="392" r="3"/><circle cx="1192" cy="418" r="3"/><circle cx="1290" cy="430" r="3"/><circle cx="1388" cy="438" r="3"/><circle cx="1486" cy="432" r="3"/></g>

  <!-- Bottom-center horizontal chart: never full width -->
  <g filter="url(#shadow)"><rect class="card" x="806" y="506" width="358" height="202" rx="9"/></g>
  <text x="824" y="534" class="label">Monthly Revenue</text><text x="824" y="552" class="tiny muted">USD (thousands)</text>
  <g class="tiny muted"><text x="824" y="579">Jan</text><text x="824" y="601">Mar</text><text x="824" y="623">May</text><text x="824" y="645">Jul</text><text x="824" y="667">Sep</text></g>
  <g fill="#3478f6"><rect x="858" y="567" width="154" height="12" rx="3"/><rect x="858" y="589" width="214" height="12" rx="3"/><rect x="858" y="611" width="176" height="12" rx="3"/><rect x="858" y="633" width="246" height="12" rx="3"/><rect x="858" y="655" width="228" height="12" rx="3"/></g>
  <text x="864" y="692" class="tiny muted">0</text><text x="960" y="692" class="tiny muted">25,000</text><text x="1062" y="692" class="tiny muted">50,000</text>

  <!-- Bottom-right improvements -->
  <g filter="url(#shadow)"><rect class="card" x="1180" y="506" width="372" height="202" rx="9"/></g>
  <text x="1198" y="534" class="label">Best Improvement Opportunities</text><text x="1198" y="552" class="tiny muted">Prioritized by operational impact</text>
  <circle cx="1205" cy="581" r="10" fill="#edf5ff"/><text x="1202" y="585" class="tiny" fill="#2571d8">1</text><text x="1224" y="578" class="small">Rebalance enterprise coverage</text><text x="1224" y="595" class="tiny muted">Focus capacity on the two fastest-growing sites.</text>
  <line x1="1198" y1="608" x2="1532" y2="608" stroke="#edf0f5"/>
  <circle cx="1205" cy="632" r="10" fill="#edf5ff"/><text x="1202" y="636" class="tiny" fill="#2571d8">2</text><text x="1224" y="629" class="small">Reduce aging backlog</text><text x="1224" y="646" class="tiny muted">Prioritize items older than the forecast window.</text>
  <line x1="1198" y1="660" x2="1532" y2="660" stroke="#edf0f5"/>
  <circle cx="1205" cy="682" r="10" fill="#edf5ff"/><text x="1202" y="686" class="tiny" fill="#2571d8">3</text><text x="1224" y="679" class="small">Tighten forecast alerts</text><text x="1224" y="696" class="tiny muted">Alert when backlog growth outpaces revenue.</text>

  <!-- Acceptance annotation -->
  <rect x="48" y="734" width="1504" height="132" rx="9" fill="#f7faff" stroke="#d9e7ff"/>
  <text x="68" y="760" class="label" fill="#205fb7">Implemented layout contract</text>
  <g class="small muted">
    <text x="68" y="787">• One shared ITSM header component for AI and governed dashboards</text>
    <text x="68" y="812">• Period, configured dimension, dimension value, dashboard selector, Edit layout, AI edit, and Refresh stay together</text>
    <text x="68" y="837">• Operational brief spans the page; KPIs lead; horizontal bars are ≤ 6/12 columns; opportunities default bottom-right</text>
    <text x="860" y="787">• Drag and resize are enabled only in Edit layout mode and persist to dashboard config</text>
    <text x="860" y="812">• Axis display units divide ticks without changing query values</text>
    <text x="860" y="837">• Example above uses USD (thousands), so 37,100 represents $37.1M</text>
  </g>
</svg>
