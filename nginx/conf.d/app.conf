upstream tablescope_web {
    server web-ui:3000;
}

upstream tablescope_api {
    server platform-api:8000;
}

# HTTP: serve the ACME challenge and redirect everything else to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name app.tablescope.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: TLS termination + reverse proxy to the app.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.tablescope.cloud;

    ssl_certificate     /etc/letsencrypt/live/app.tablescope.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.tablescope.cloud/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Allow document/file uploads through the proxy.
    client_max_body_size 100m;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Platform API (FastAPI) — kept same-origin so the browser avoids
    # mixed-content and a second public port.
    location /api/ {
        proxy_pass http://tablescope_api;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Web UI (Next.js).
    location / {
        proxy_pass http://tablescope_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
