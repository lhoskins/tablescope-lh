<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>File Upload</title>
<style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f2f2f2;
    }

    h2 {
      text-align: center;
      color: #333;
    }

    form {
      width: 400px;
      margin: 0 auto;
      background-color: #f6f7f8;
      padding: 20px;
      border-radius: 5px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    label {
      display: block;
      margin-bottom: 10px;
      color: #333;
    }


    input[type="submit"] {
      background-color: #4CAF50;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
    }


    .btn-ts {
      background-color: #4CAF50;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <form id="uploadForm" enctype="multipart/form-data">
        <h3>Upload Files</h3>
        <div class="drop_box">
          <header>
            <h4>Select File here</h4>
          </header>
          <p>Files Supported: XLS, CSV, TXT , Google Sheets</p><p></p><p></p>
		  <input type="file" name="file" id="fileInput"><p></p><p></p>		
          <button class="btn-ts" type="submit">Upload</button>
	    </div>
  <div id="message"></div>
  </form>


 <script>
    document.getElementById('uploadForm').addEventListener('submit', function(event) {
      event.preventDefault();
      const formData = new FormData();
      formData.append('file', document.getElementById('fileInput').files[0]);

      fetch('https://ssl.amt.hopi.cloud:3000/upload', {
        method: 'POST',
        body: formData
      })
      .then(response => {
        if (!response.ok) {
          throw new Error('Error uploading file');
        }
        return response.text();
      })
      .then(message => {
        document.getElementById('message').innerText = message;
      })
      .catch(error => {
        console.error('Error:', error);
        document.getElementById('message').innerText = 'Error uploading file';
      });
    });
  </script>
</body>
</html>
