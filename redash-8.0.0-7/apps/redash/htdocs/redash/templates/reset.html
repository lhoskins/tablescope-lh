{% extends "layouts/signed_out.html" %}

{% block title %}Password Reset{% endblock %}

{% block content %}
<div class="fixed-width-page">
  <div class="bg-white tiled">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-danger" role="alert">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <form role="form" method="post" name="invite" onsubmit="return validatePasswords()">
      <div class="form-group">
        <label for="password">Enter your new password:</label>
        <input type="password" class="form-control" id="password" name="password" placeholder="Password" required minlength="6">
      </div>
      <div class="form-group">
        <label for="password_confirm">Confirm your new password:</label>
        <input type="password" class="form-control" id="password_confirm" name="password_confirm" placeholder="Confirm Password" required minlength="6">
      </div>
      <div id="password-error" class="alert alert-danger" style="display: none;"></div>
      <button type="submit" class="btn btn-primary btn-block m-t-25">Change my password</button>
    </form>
    <script>
      function validatePasswords() {
        var password = document.getElementById('password').value;
        var confirmPassword = document.getElementById('password_confirm').value;
        var errorDiv = document.getElementById('password-error');
        
        if (password !== confirmPassword) {
          errorDiv.textContent = 'Passwords do not match. Please try again.';
          errorDiv.style.display = 'block';
          return false;
        }
        
        if (password.length < 6) {
          errorDiv.textContent = 'Password must be at least 6 characters long.';
          errorDiv.style.display = 'block';
          return false;
        }
        
        errorDiv.style.display = 'none';
        return true;
      }
    </script>
  </div>
</div>
{% endblock %}
