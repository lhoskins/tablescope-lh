[global]
   workgroup = TABLESCOPE
   server string = TableScope E2E Repository
   server role = standalone server
   server signing = mandatory
   smb encrypt = required
   server min protocol = SMB2_02
   server max protocol = SMB3
   guest account = nobody
   map to guest = never
   bind interfaces only = yes
   interfaces = lo eth0 eth1
   hosts allow = 10.250.10.0/24 10.250.20.0/24 127.0.0.1
   log file = /var/log/samba/log.%m
   max log size = 1000
   syslog = 0
   panic action = /usr/share/samba/panic-action %d

[repository]
   comment = Customer repository for E2E
   path = /srv/repository
   read only = yes
   browsable = yes
   valid users = tablescope_ro
   hide dot files = yes
   veto files = /.*/
